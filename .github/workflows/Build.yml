name: Build Podnikatel SaaS

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository files
        run: |
          echo "Repository:"
          pwd
          echo
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      - name: Check ZIP
        run: |
          test -f podnikatel-saas-final-v10.zip
          echo "ZIP found:"
          ls -lh podnikatel-saas-final-v10.zip

      - name: Test ZIP integrity
        run: |
          unzip -t podnikatel-saas-final-v10.zip

      - name: Extract ZIP
        run: |
          rm -rf build
          mkdir -p build

          unzip -q podnikatel-saas-final-v10.zip -d build

          echo "Extracted files:"
          find build -maxdepth 3 -type f | sort

      - name: Detect application root
        run: |
          if [ -f "build/composer.json" ]; then
            echo "APP_ROOT=build" >> "$GITHUB_ENV"
          elif [ -f "build/podnikatel/composer.json" ]; then
            echo "APP_ROOT=build/podnikatel" >> "$GITHUB_ENV"
          else
            echo "ERROR: composer.json was not found"
            find build -maxdepth 5 -type f | sort
            exit 1
          fi

      - name: Show application root
        run: |
          echo "APP_ROOT=$APP_ROOT"
          ls -la "$APP_ROOT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, curl, fileinfo, openssl
          tools: composer

      - name: Composer validate
        working-directory: ${{ env.APP_ROOT }}
        run: composer validate --no-check-publish

      - name: Composer install
        working-directory: ${{ env.APP_ROOT }}
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        working-directory: ${{ env.APP_ROOT }}
        run: |
          find . \
            -path './vendor' -prune -o \
            -name '*.php' -type f -print0 |
          xargs -0 -n1 php -l

      - name: Test Composer autoload
        working-directory: ${{ env.APP_ROOT }}
        run: |
          php -r "require 'vendor/autoload.php'; echo 'Autoload OK'.PHP_EOL;"

      - name: Test PDO SQLite
        run: |
          php -r '
          $pdo = new PDO("sqlite::memory:");
          $pdo->query("SELECT 1");
          echo "PDO SQLite OK\n";
          '

      - name: Check required files
        working-directory: ${{ env.APP_ROOT }}
        run: |
          test -f composer.json
          test -f public/index.php
          test -f src/bootstrap.php
          test -f src/Core/Kernel.php

          echo "Required files OK"

      - name: Final result
        run: |
          echo "======================================"
          echo "PODNIKATEL SAAS BUILD OK"
          echo "======================================"